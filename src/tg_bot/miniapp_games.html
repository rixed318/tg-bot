<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Snake</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0;background:#090d14;color:#e6edf3;font:14px system-ui;display:flex;flex-direction:column;align-items:center;padding:8px;user-select:none}.bar{display:flex;gap:10px;align-items:center;margin-bottom:8px;width:296px;justify-content:space-between}.pill{background:#161b22;border:1px solid #30363d;border-radius:99px;padding:3px 12px;font-weight:700;color:#58a6ff}button{background:#238636;color:#fff;border:0;border-radius:9px;padding:7px 13px;font-weight:700}canvas{background:#0f1622;border:2px solid #238636;border-radius:12px;box-shadow:0 0 18px #23863633;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin-top:8px}.pad button{background:#1c2432;padding:11px 0;font-size:18px;border:1px solid #30363d}#st{margin-top:5px;font-size:12px;color:#8b949e}</style>
<div class="bar"><b>🐍 Змейка</b><span class="pill" id="sc">0</span><button onclick="init()">Рестарт</button></div>
<canvas id="c" width="296" height="296"></canvas><div id="st">Свайпай или жми стрелки</div>
<div class="pad"><div></div><button onclick="dir(0,-1)">⬆️</button><div></div><button onclick="dir(-1,0)">⬅️</button><button onclick="dir(0,1)">⬇️</button><button onclick="dir(1,0)">➡️</button></div>
<script>
const tg=Telegram?.WebApp,q=new URLSearchParams(location.search);if(tg){tg.ready();tg.expand()}
const u=tg?.initDataUnsafe?.user||{id:q.get('uid')||0,username:q.get('uname')||'',first_name:q.get('dname')||'Player'},cv=c,x=cv.getContext('2d'),N=16,S=296/N;
let sn,d,nd,ap,pt=[],sc,sp,ls=0,ac=0,dd=0,tx=0,ty=0;
function spawn(){do{ap={x:Math.random()*N|0,y:Math.random()*N|0}}while(sn.some(p=>p.x==ap.x&&p.y==ap.y))}
function init(){sn=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];d=nd={x:1,y:0};sc=0;sp=125;dd=0;pt=[];spawn();upd('Поехали!')}
function dir(dx,dy){if(dx!==-d.x||dy!==-d.y)nd={x:dx,y:dy}}
function upd(m){document.getElementById('sc').textContent=sc;if(m)st.textContent=m}
function save(){if(sc<=0)return;fetch('/arcade/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:+u.id||0,username:u.username||'',display_name:u.first_name||'Player',game:'snake',score:sc})}).catch(()=>{});if(tg)try{tg.sendData(JSON.stringify({game:'snake',score:sc}))}catch(e){}}
function tick(){d=nd;const h={x:sn[0].x+d.x,y:sn[0].y+d.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(p=>p.x==h.x&&p.y==h.y)){dd=1;upd('💀 Конец! Очки: '+sc);save();return}sn.unshift(h);if(h.x==ap.x&&h.y==ap.y){sc+=10;sp=Math.max(62,sp-2.5);for(let i=0;i<10;i++)pt.push({x:(ap.x+.5)*S,y:(ap.y+.5)*S,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,l:18});upd('🍎 +10!');spawn()}else sn.pop()}
function draw(ts){if(!ls)ls=ts;const dt=Math.min(50,ts-ls);ls=ts;if(!dd){ac+=dt;while(ac>=sp){ac-=sp;tick();if(dd)break}}x.fillStyle='#0f1622';x.fillRect(0,0,296,296);x.strokeStyle='#182234';for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,296);x.moveTo(0,i*S);x.lineTo(296,i*S);x.stroke()}x.fillStyle='#ff4d6d';x.beginPath();x.arc((ap.x+.5)*S,(ap.y+.5)*S,S/2.5+Math.sin(ts/140)*1.3,0,7);x.fill();sn.forEach((p,i)=>{x.fillStyle=i?`hsl(${140-i*2},70%,${Math.max(30,52-i)}%)`:'#7ee787';x.beginPath();x.roundRect(p.x*S+1.5,p.y*S+1.5,S-3,S-3,5);x.fill()});pt=pt.filter(p=>--p.l>0);pt.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=`rgba(255,90,120,${p.l/18})`;x.fillRect(p.x,p.y,3,3)});requestAnimationFrame(draw)}
cv.ontouchstart=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY};cv.ontouchend=e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>18||Math.abs(dy)>18)Math.abs(dx)>Math.abs(dy)?dir(dx>0?1:-1,0):dir(0,dy>0?1:-1)};
onkeydown=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();dir(...m)}};
init();requestAnimationFrame(draw);
</script></html>

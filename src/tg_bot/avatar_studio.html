<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rixed Avatar Studio</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d14;color:#e6edf3;font:14px/1.4 system-ui;display:flex;flex-direction:column;align-items:center;padding:12px;user-select:none}
.wrap{width:328px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;justify-content:space-between;align-items:center}
.badge{background:#1f2937;border:1px solid #374151;border-radius:99px;padding:3px 10px;font-size:12px;color:#93c5fd}
.preview{background:#111827;border:2px solid #30363d;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.preview img{width:220px;height:220px;border-radius:14px;image-rendering:pixelated;background:#090d14;border:1px solid #30363d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
button{background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:10px;padding:9px 8px;font-weight:600;cursor:pointer;font-size:13px}
button.on{background:#1f6feb;border-color:#58a6ff;color:#fff}
.apply{background:#238636;border-color:#2ea043;color:#fff;padding:11px;font-size:15px}
.shop{background:#161b22;border:1px dashed #30363d;border-radius:12px;padding:10px;font-size:12px;color:#9ca3af}
#st{font-size:12px;color:#7ee787;text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><b>🎨 Avatar Studio</b><span class="badge">Магазин · Бета</span></div>
  <div class="preview">
    <img id="img" src="" alt="preview">
    <b id="title">Ксюша · Обычный</b>
    <button class="apply" style="width:100%" onclick="applyLook()">✨ Применить образ в боте</button>
    <div id="st">Выбери персонажа и наряд</div>
  </div>
  <div class="grid" id="chars"></div>
  <b>👗 Наряды, волосы и аксессуары</b>
  <div class="grid" id="outfits"></div>
  <div class="shop">
    <b>🛍 Магазин аватаров и голосов (скоро)</b><br>
    • Кастомный 2D-персонаж под твою внешность<br>
    • Обучение твоего голоса (`F5-TTS`) по записи<br>
    • Эксклюзивные наряды, панамы и аксессуары
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const CHARS=[['ksyusha','Ксюша'],['anya','Аня'],['ruslan','Руслан'],['kaneki','Канеки'],['haldina','Халдина'],['serezha','Серёжа'],['artem','Артём'],['katya','Катя'],['karina','Карина'],['nikita','Никита']];
const OUTFITS=[['quality','✨ Обычный'],['street','🧥 Streetwear'],['cyber','🤖 Cyberpunk'],['cozy','🧶 Cozy'],['buns','🎀 Пучки'],['beach','🏖 Купальник'],['panama','🧢 Панама'],['funny','🤪 Ржачный']];
let curChar='ksyusha',curOut='quality';
function render(){
  const cBox=document.getElementById('chars'),oBox=document.getElementById('outfits');
  cBox.innerHTML='';oBox.innerHTML='';
  CHARS.forEach(([id,nm])=>{const b=document.createElement('button');b.className=id===curChar?'on':'';b.textContent=nm;b.onclick=()=>{curChar=id;render()};cBox.appendChild(b)});
  OUTFITS.forEach(([id,nm])=>{const b=document.createElement('button');b.className=id===curOut?'on':'';b.textContent=nm;b.onclick=()=>{curOut=id;render()};oBox.appendChild(b)});
  const folder=curOut==='quality'?curChar:`${curChar}_${curOut}`;
  const img=document.getElementById('img');
  img.src=`/arcade/avatar/${folder}/neutral_closed.png`;
  img.onerror=()=>{img.src=`/arcade/avatar/${curChar}/neutral_closed.png`};
  const cn=CHARS.find(x=>x[0]===curChar)[1],on=OUTFITS.find(x=>x[0]===curOut)[1];
  document.getElementById('title').textContent=`${cn} · ${on}`;
}
function applyLook(){
  const st=document.getElementById('st');st.textContent='Сохраняю...';
  fetch('/arcade/api/set_visual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({persona:curChar,speech_display:curOut})})
    .then(r=>r.json()).then(d=>{st.textContent=d.ok?'✅ Образ применён в боте!':'❌ Ошибка'})
    .catch(()=>{st.textContent='❌ Ошибка сети'});
}
render();
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-bot"
version = "0.2.0"
description = "Voice-first Telegram group & DM AI bot with stateful trigger flags, multi-message batching, Russian voice cloning, and unlimited Google Drive context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
]

[project.optional-dependencies]
worker = [
    "edge-tts>=7.0",
    "faster-whisper>=1.1",
    "f5-tts>=1.1",
    "huggingface-hub>=0.25",
    "num2words>=0.5",
    "ruaccent>=1.5",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
